<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<script>
/* 首帧前定主题：避免深色用户看到一帧白底闪烁。
   这段必须是同步内联脚本，放在任何样式之前。 */
(function () {
  var t;
  try {
    var saved = localStorage.getItem('ds.theme');
    if (saved) t = JSON.parse(saved);
  } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.dataset.theme = t;
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#17150f' : '#f7f5f0');
})();
</script>
<title>DeepSeek 助手</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app" id="app">

  <!-- ============ 顶栏 ============ -->
  <header class="topbar" id="topbar">
    <button class="icon-btn" id="btnMenu" aria-label="会话列表">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="M4 7h16M4 12h16M4 17h16"/>
      </svg>
    </button>

    <button class="model-pick" id="btnModel">
      <span id="modelName">DeepSeek</span>
      <svg class="chev" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="m6 9 6 6 6-6"/>
      </svg>
    </button>

    <button class="icon-btn" id="btnNew" aria-label="新对话">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>

    <button class="icon-btn" id="btnSettings" aria-label="设置">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.7 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.7h.09A1.7 1.7 0 0 0 10.1 3.14V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.3 9v.09a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15Z"/>
      </svg>
    </button>

    <button class="icon-btn" id="btnTheme" aria-label="切换主题">
      <svg class="ico-sun" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
      </svg>
      <svg class="ico-moon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/>
      </svg>
    </button>
  </header>

  <!-- ============ 聊天区 ============ -->
  <div class="main-wrap">
    <main class="chat-scroll" id="scroll">
      <div class="chat-inner" id="messages"></div>
    </main>
    <button class="to-bottom" id="btnToBottom" hidden aria-label="回到底部">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12l7 7 7-7"/>
      </svg>
    </button>
  </div>

  <!-- ============ 输入区 ============ -->
  <div class="composer-wrap">
    <div class="attach-strip" id="attachStrip" hidden></div>
    <div class="composer" id="composer">
      <button class="icon-btn attach-btn" id="btnAttach" aria-label="添加文件">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
      <textarea id="input" rows="1" placeholder="发消息…" autocomplete="off"></textarea>
      <button class="send-btn" id="btnSend" disabled aria-label="发送">
        <svg class="ico-send" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
        <svg class="ico-stop" viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
          <rect x="6" y="6" width="12" height="12" rx="2.5"/>
        </svg>
      </button>
    </div>
    <div class="composer-hint">
      <span id="hintText">内容由 DeepSeek 生成，请注意核实</span>
      <span class="spacer"></span>
      <span id="usageText"></span>
    </div>
  </div>
</div>

<!-- ============ 会话抽屉 ============ -->
<div class="sheet-mask" id="sheetMask" hidden></div>
<aside class="sheet" id="sheet" hidden>
  <div class="sheet-head">
    <span>会话</span>
    <button class="icon-btn" id="btnCloseSheet" aria-label="关闭">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="sheet-search">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="10.5" cy="10.5" r="6"/><path d="m19.5 19.5-4.2-4.2"/>
    </svg>
    <input id="sessionSearch" type="search" placeholder="搜索会话" autocomplete="off" spellcheck="false">
  </div>
  <div class="sheet-list" id="sheetList"></div>
</aside>

<!-- ============ 底部动作面板（附件 / 模型） ============ -->
<div class="sheet-mask" id="actionMask" hidden></div>
<div class="action-sheet" id="actionSheet" hidden>
  <div class="action-title" id="actionTitle"></div>
  <div id="actionBody"></div>
  <button class="action-cancel" id="actionCancel">取消</button>
</div>

<!-- ============ 设置 ============ -->
<div class="sheet-mask" id="settingsMask" hidden></div>
<div class="fullsheet" id="settings" hidden>
  <div class="sheet-head">
    <span>设置</span>
    <button class="icon-btn" id="btnCloseSettings" aria-label="关闭">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body">

    <div class="field-group">连接</div>

    <label class="field">
      <span class="field-label">DeepSeek API Key</span>
      <div class="input-row">
        <input type="password" id="apiKeyInput" placeholder="sk-…" autocomplete="off" spellcheck="false">
        <button class="btn-line" id="btnToggleKey">显示</button>
      </div>
      <span class="field-hint">在 platform.deepseek.com 创建。密钥只保存在本机，不会上传到任何第三方。</span>
    </label>

    <label class="field">
      <span class="field-label">模型</span>
      <div class="seg" id="modelSeg">
        <button data-model="deepseek-flash" class="on">Flash · 快</button>
        <button data-model="deepseek-v4-pro">V4 Pro · 强</button>
      </div>
      <span class="field-hint">联网搜索、阅读链接、文件解析都只在 Flash 上可用；Pro 只做纯文本推理。</span>
    </label>

    <div class="field-group">能力</div>

    <div class="field">
      <span class="field-label">全家桶能力</span>
      <label class="switch-row">
        <span>
          <b>联网搜索</b>
          <em>需要实时信息时模型自己去查，并附来源</em>
        </span>
        <input type="checkbox" id="swSearch" checked>
      </label>
      <label class="switch-row">
        <span>
          <b>深度思考</b>
          <em>开启后模型边推理边搜索，最多约 20 步</em>
        </span>
        <input type="checkbox" id="swThinking">
      </label>
      <label class="switch-row">
        <span>
          <b>阅读链接</b>
          <em>消息里出现网址时自动抓取正文</em>
        </span>
        <input type="checkbox" id="swReadUrl" checked>
      </label>
      <label class="switch-row">
        <span>
          <b>内容安全</b>
          <em>输入输出过一遍风险审核</em>
        </span>
        <input type="checkbox" id="swSafety">
      </label>
      <label class="switch-row">
        <span>
          <b>自动标题</b>
          <em>回答结束时由服务端生成简短会话标题</em>
        </span>
        <input type="checkbox" id="swAutoTitle" checked>
      </label>
    </div>

    <div class="field-group">行为</div>

    <label class="field">
      <span class="field-label">系统提示词</span>
      <textarea id="sysPrompt" rows="4" spellcheck="false"></textarea>
    </label>

    <div class="field">
      <span class="field-label">关于</span>
      <div class="about" id="aboutText"></div>
    </div>

  </div>
  <div class="sheet-foot">
    <button class="btn-plain" id="btnTest">测试连接</button>
    <button class="btn-fill" id="btnSave">保存</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="md.js"></script>
<script src="app.js"></script>
</body>
</html>
