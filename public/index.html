<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<script>
  // 主题必须在首帧前确定，避免闪白/闪黑
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('ds.theme'); } catch (e) {}
    var dark = saved ? saved === '"dark"' || saved === 'dark'
                     : matchMedia('(prefers-color-scheme: dark)').matches;
    var t = dark ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'dark' ? '#17150f' : '#f7f5f0');
  })();
</script>
<title>DeepSeek 聊天助手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%90%8B%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app" id="app">

  <!-- ================= 侧栏 ================= -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
            <path d="M4 9.5C7 5.6 13.5 4.6 17 8.4c1.4 1.5 1.9 3.6 1.2 5.5"
                  stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M18.6 8.6 21 9.9l-2.1 1.6" stroke="currentColor" stroke-width="1.4"
                  stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 9.5c1.9 3.9 6 6.6 10.5 6.3" stroke="currentColor" stroke-width="1.4"
                  stroke-linecap="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <strong>DeepSeek</strong>
          <span>聊天助手</span>
        </div>
      </div>
      <button class="btn-ghost icon-btn" id="btnCollapse" title="收起侧栏" aria-label="收起侧栏">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/>
        </svg>
      </button>
    </div>

    <button class="new-chat" id="btnNew">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      <span>开启新对话</span>
    </button>

    <div class="session-list" id="sessionList"></div>

    <div class="sidebar-foot">
      <button class="foot-btn" id="btnSettings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.7 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.7h.09A1.7 1.7 0 0 0 10.1 3.14V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.3 9v.09a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15Z"/>
        </svg>
        <span>设置</span>
        <span class="key-dot" id="keyDot" title="API Key 未配置"></span>
      </button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- ================= 主区 ================= -->
  <main class="main">
    <header class="topbar">
      <button class="btn-ghost icon-btn menu-btn" id="btnMenu" aria-label="菜单">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <path d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>

      <div class="model-pick">
        <select id="modelSelect" aria-label="选择模型">
          <option value="deepseek-flash">DeepSeek Flash · 快速</option>
          <option value="deepseek-v4-pro">DeepSeek V4 Pro · 复杂推理</option>
        </select>
        <svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </div>

      <div class="topbar-title" id="chatTitle"></div>

      <div class="topbar-right">
        <button class="btn-ghost icon-btn theme-btn" id="btnTheme" title="切换明暗" aria-label="切换明暗">
          <svg class="ico-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
          </svg>
          <svg class="ico-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="chat-scroll" id="scroll">
      <div class="chat-inner" id="messages"></div>
    </div>

    <div class="composer-wrap">
      <div class="attach-strip" id="attachStrip" hidden></div>
      <div class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="给 DeepSeek 发消息…" autocomplete="off"></textarea>
        <div class="composer-tools">
          <button class="icon-btn attach-btn" id="btnAttach" type="button" title="添加文件（PDF / Word / 图片…）" aria-label="添加文件">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>
          <input type="file" id="filePicker" multiple
                 accept=".pdf,.doc,.docx,.ppt,.pptx,.png,.jpg,.jpeg,.webp,.gif,.bmp,.tiff,.txt,.md,.csv,.json,.xlsx,.xls,.epub,.mobi"
                 hidden>
          <button class="tool-pill" id="btnThink" type="button" aria-pressed="false" title="深度思考：模型先推理再回答，慢一些但更深入">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3a6.5 6.5 0 0 0-6.5 6.5c0 2.4 1.3 3.9 2.3 5.2.6.8.9 1.6 1 2.3h6.4c.1-.7.4-1.5 1-2.3 1-1.3 2.3-2.8 2.3-5.2A6.5 6.5 0 0 0 12 3Z"/>
              <path d="M9.5 20h5M10.5 22h3"/>
            </svg>
            <span>深度思考</span>
          </button>
          <button class="tool-pill" id="btnSearch" type="button" aria-pressed="true" title="联网搜索：遇到时效性问题自动搜索并附引用">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
              <circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.3 3.8 5.2 3.8 8.5s-1.3 6.2-3.8 8.5c-2.5-2.3-3.8-5.2-3.8-8.5S9.5 5.8 12 3.5Z"/>
            </svg>
            <span>联网搜索</span>
          </button>
          <div class="composer-actions">
            <button class="edit-cancel" id="btnEditCancel" type="button" hidden title="取消编辑（Esc）">取消</button>
            <button class="send-btn" id="btnSend" disabled aria-label="发送">
              <svg class="ico-send" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19V5M5 12l7-7 7 7"/>
              </svg>
              <svg class="ico-stop" viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
                <rect x="6" y="6" width="12" height="12" rx="2.5"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
      <div class="composer-hint">
        <span id="hintText">内容由 AI 生成，请注意核实</span>
        <span class="spacer"></span>
        <span id="usageText"></span>
      </div>
    </div>
    <button class="jump-latest" id="btnJumpLatest" hidden aria-label="回到最新">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
      <span>回到最新</span>
    </button>
  </main>

  <div class="sources-scrim" id="sourcesScrim"></div>
  <aside class="sources-drawer" id="sourcesDrawer" aria-label="参考来源" aria-hidden="true">
    <div class="sources-head">
      <div class="sources-head-title">
        <strong id="sourcesTitle">参考来源</strong>
        <span class="sources-count" id="sourcesCount"></span>
      </div>
      <button class="btn-ghost icon-btn" id="btnCloseSources" aria-label="关闭来源">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6 6l12 12M18 6 6 18"/>
        </svg>
      </button>
    </div>
    <div class="sources-body" id="sourcesBody"></div>
  </aside>
</div>

<!-- ================= 设置弹窗 ================= -->
<div class="modal-mask" id="settingsModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-head">
      <h2 id="settingsTitle">设置</h2>
      <button class="btn-ghost icon-btn" id="btnCloseSettings" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6 6l12 12M18 6 6 18"/>
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <label class="field">
        <span class="field-label">DeepSeek API Key</span>
        <div class="input-row">
          <input type="password" id="apiKeyInput" placeholder="sk-…" autocomplete="off" spellcheck="false">
          <button class="btn-ghost small" id="btnToggleKey">显示</button>
        </div>
        <span class="field-hint">在 platform.deepseek.com →「API keys」创建。密钥只保存在本机 <code>data/config.json</code>，不会发往第三方。</span>
      </label>

      <label class="field">
        <span class="field-label">API 地址</span>
        <input type="text" id="baseUrlInput" placeholder="https://api.deepseek.com" spellcheck="false">
        <span class="field-hint">官方地址默认即可。用中转/自建服务时改成对应的 base URL。</span>
      </label>

      <label class="field switch-row">
        <span>
          <span class="field-label">联网搜索</span>
          <span class="field-hint">官方 <code>deepseek_web_search</code>，模型按需自主搜索并附引用。搜索/抓取各 5 元 / 1000 次。</span>
        </span>
        <input type="checkbox" id="searchCheck">
      </label>

      <label class="field switch-row">
        <span>
          <span class="field-label">阅读链接</span>
          <span class="field-hint">官方 <code>deepseek_read_url</code>，消息里出现网址时自动读取。</span>
        </span>
        <input type="checkbox" id="readUrlCheck">
      </label>

      <label class="field switch-row">
        <span>
          <span class="field-label">深度思考</span>
          <span class="field-hint">开启后模型先推理再回答；配合联网即「深度思考搜索」。</span>
        </span>
        <input type="checkbox" id="thinkingCheck">
      </label>

      <label class="field switch-row">
        <span>
          <span class="field-label">内容安全审核</span>
          <span class="field-hint">开启官方风控，命中风险时模型拒答。对外提供服务时建议开启。</span>
        </span>
        <input type="checkbox" id="safetyCheck">
      </label>

      <label class="field switch-row">
        <span>
          <span class="field-label">自动生成会话标题</span>
          <span class="field-hint">回答结束时由服务端生成简短标题。</span>
        </span>
        <input type="checkbox" id="titleCheck">
      </label>

      <label class="field">
        <span class="field-label">系统提示词</span>
        <textarea id="sysPromptInput" rows="5" spellcheck="false"></textarea>
        <span class="field-hint">决定助手的语气和边界，改动立即生效于新消息。</span>
      </label>

      <div class="search-status" id="searchStatus"></div>
    </div>

    <div class="modal-foot">
      <button class="btn-ghost" id="btnTestKey">测试连接</button>
      <span class="spacer"></span>
      <button class="btn-primary" id="btnSaveSettings">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="/app.js"></script>
</body>
</html>
